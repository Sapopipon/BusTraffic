<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bus Jam 3D</title>
<meta name="theme-color" content="#1e88e5">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<meta name="mobile-web-app-capable" content="yes">

<style>
:root{--bg:#eef2f7;--card:#fff;--text:#1d2733;--muted:#6b7a8c;--lot:#cfd6df;--cell:#dde3ea;--accent:#1e88e5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151c;--card:#1a222c;--text:#e8edf3;--muted:#8fa0b3;--lot:#2a3441;--cell:#242d39;--accent:#42a5f5}}
:root[data-theme="dark"]{--bg:#10151c;--card:#1a222c;--text:#e8edf3;--muted:#8fa0b3;--lot:#2a3441;--cell:#242d39;--accent:#42a5f5}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;min-height:100vh}
#app{width:100%;max-width:520px;padding:14px;display:flex;flex-direction:column;gap:11px;align-items:center}
h1{font-size:20px;margin:0;letter-spacing:.2px}
.top{display:flex;justify-content:space-between;align-items:center;width:100%}
.pill{background:var(--card);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:8px 14px;background:var(--accent);color:#fff;cursor:pointer}
.panel{background:var(--card);border-radius:16px;padding:10px;width:100%}
.lbl{font-size:12px;color:var(--muted);margin:0 0 6px 2px}
#stops{display:flex;gap:6px;justify-content:space-between}
.slot{flex:1;height:54px;border-radius:10px;background:var(--cell);display:flex;align-items:center;justify-content:center}
.sbus{width:88%;height:80%;border-radius:8px;display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:5px;box-shadow:inset 0 -3px rgba(0,0,0,.2)}
.seat{border-radius:50%;background:rgba(255,255,255,.35)}
.seat.on{background:#fff}
#cv{width:100%;height:min(62vh,560px);min-height:390px;border-radius:18px;background:#9bc7df;overflow:hidden;touch-action:manipulation;box-shadow:0 12px 28px rgba(20,35,50,.22)}
#cv canvas{display:block}
#wheelp{background:linear-gradient(145deg,#dceaf4,#aabbd0);border:1px solid rgba(255,255,255,.9);box-shadow:inset 0 3px 8px #fff8,0 7px 18px #26384a25}
#ring{width:100%;height:245px;display:block;touch-action:none;cursor:grab;filter:drop-shadow(0 7px 4px #26384a35)}
#cv{background:linear-gradient(#d8e4ef,#aabbd0);border:3px solid #f8fbff}
.panel{box-shadow:0 5px 14px rgba(25,45,65,.10)}
.slot.lock{background:transparent;border:2px dashed var(--muted);color:var(--muted);font-size:24px;cursor:pointer}
#msg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:20px}
#msg>div{background:var(--card);border-radius:20px;padding:24px;text-align:center;max-width:300px}
#msg h2{margin:0 0 6px}
#msg p{margin:0 0 14px;color:var(--muted)}

/* Ajuste compacto para que la ruleta, las paradas y el estacionamiento
   entren juntos en una pantalla de celular. */
html, body { width:100%; height:100%; min-height:0; overflow:hidden; }
body { min-height:0; }
#app {
  width:100%;
  max-width:520px;
  height:100vh;
  height:100dvh;
  min-height:0;
  padding:6px 9px;
  gap:6px;
  overflow:hidden;
}
.top { flex:0 0 auto; min-height:32px; gap:6px; }
h1 { font-size:16px; }
.pill { padding:4px 9px; font-size:11px; white-space:nowrap; }
button { padding:6px 9px; border-radius:9px; font-size:12px; white-space:nowrap; }
.panel { padding:6px; border-radius:12px; flex:0 0 auto; }
.lbl { font-size:10px; line-height:1.15; margin:0 0 4px 2px; }
#wheelp { padding:5px 7px; }
#ring {
  height:clamp(92px, 16vh, 132px);
  max-height:132px;
  filter:drop-shadow(0 3px 3px #26384a30);
}
#stops { gap:4px; }
.slot { height:38px; min-width:0; border-radius:7px; }
.sbus { padding:3px; gap:2px; border-radius:5px; }
.slot.lock { font-size:19px; }
#cv {
  flex:1 1 auto;
  width:100%;
  height:auto;
  min-height:0;
  border-radius:13px;
  box-shadow:0 5px 14px rgba(20,35,50,.18);
}
#app > p.lbl { flex:0 0 auto; margin:0; font-size:10px; }
#msg { z-index:5; }
@media (max-height:650px) {
  #app { padding:4px 7px; gap:4px; }
  #ring { height:clamp(76px, 13vh, 100px); }
  .slot { height:32px; }
  #app > p.lbl { font-size:9px; }
}

</style>

<body>
<div id="app">
  <div class="top"><h1>🚌 Bus Jam 3D</h1><span class="pill" id="lv"></span><button id="rs">Reiniciar</button></div>
  <div class="panel" id="wheelp"><p class="lbl">Deslizá la pista 3D para elegir qué pasajero sube primero</p><canvas id="ring"></canvas></div>
  <div class="panel"><p class="lbl">Paradas: suben al vehículo de su color · toca ＋ para abrir una parada extra</p><div id="stops"></div></div>
  <div id="cv"></div>
  <p class="lbl" style="text-align:center">Tocá un vehículo para retirarlo siguiendo la flecha blanca.</p>
</div>
<div id="msg"><div><h2 id="mt"></h2><p id="mp"></p><button id="mb"></button></div></div>
<script>
const COLS=6,ROWS=7,SEATS=4;let SLOTS=5;
const COLORS=['#e53935','#1e88e5','#43a047','#f9a825','#8e24aa','#fb8c00','#00acc1'];
const $=id=>document.getElementById(id);
const rnd=n=>Math.floor(Math.random()*n);
let pid=0,pels={},level=1,buses=[],queue=[],stops=[],busy=false,over=false,anims=[];

/* ---------- Dibujo 2D con perspectiva (sin librerías: funciona sin internet) ---------- */
const cv=$('cv'),cnv=document.createElement('canvas'),cx2=cnv.getContext('2d');cv.appendChild(cnv);
const scene={add(){},remove(m){m.done=true}};
const makeVehicle=b=>({ox:0,oy:0,done:false});
const VEC={U:[0,-1],D:[0,1],L:[-1,0],R:[1,0]};
const K=.82;let CS=40,OX=0,OY=0,W0=0,H0=0;
function resize(){
  const dpr=Math.min(devicePixelRatio||1,2);W0=cv.clientWidth;H0=cv.clientHeight;
  cnv.width=W0*dpr;cnv.height=H0*dpr;cnv.style.width=W0+'px';cnv.style.height=H0+'px';cx2.setTransform(dpr,0,0,dpr,0,0);
  CS=Math.min(W0/(COLS+.6),H0/(ROWS*K+1));OX=(W0-COLS*CS)/2;OY=(H0-ROWS*CS*K)/2+CS*.15;
}
new ResizeObserver(resize).observe(cv);resize();
const shade=(h,f)=>{const n=parseInt(h.slice(1),16),t=f<0?0:255,p=Math.abs(f);
  return'rgb('+[n>>16,n>>8&255,n&255].map(v=>Math.round(v+(t-v)*p)).join()+')'};
const rr=(x,y,w,h,r)=>{cx2.beginPath();cx2.roundRect?cx2.roundRect(x,y,w,h,r):cx2.rect(x,y,w,h)};
function geo(b){const m=b.mesh,w=b.h?b.len:1,h=b.h?1:b.len,i=.1;
  return{x:OX+(b.c+m.ox+i)*CS,y:OY+(b.r+m.oy+i)*CS*K,w:(w-2*i)*CS,h:(h-2*i)*CS*K}}
function drawBus(b){
  // Mini auto con carrocería redondeada, capó, techo, cristales,
  // paragolpes, luces y ruedas con llantas.
  const base=geo(b),scale=.78;
  const g={x:base.x+base.w*(1-scale)/2,y:base.y+base.h*(1-scale)/2,
           w:base.w*scale,h:base.h*scale};
  const x=g.x,w=g.w,h=g.h,y=g.y,vertical=!b.h;
  const long=vertical?h:w,wide=vertical?w:h;
  const H=CS*.20, rad=Math.min(CS*.19,wide*.30), ty=y-H;
  const col=b.color;

  cx2.save();
  // Sombra de contacto y volumen inferior
  cx2.shadowColor='rgba(13,25,40,.42)';cx2.shadowBlur=7;
  cx2.shadowOffsetY=5;
  const bodyGrad=cx2.createLinearGradient(x,ty,x+w,ty+h);
  bodyGrad.addColorStop(0,shade(col,.48));
  bodyGrad.addColorStop(.28,shade(col,.16));
  bodyGrad.addColorStop(.68,col);
  bodyGrad.addColorStop(1,shade(col,-.42));
  cx2.fillStyle=shade(col,-.62);
  rr(x+1,ty+H*.55,w,h,rad);cx2.fill();
  cx2.fillStyle=bodyGrad;rr(x,ty,w,h,rad);cx2.fill();
  cx2.restore();

  // Paragolpes y contorno cromado
  cx2.strokeStyle='rgba(255,255,255,.8)';cx2.lineWidth=1.35;
  rr(x+.7,ty+.7,w-1.4,h-1.4,rad);cx2.stroke();
  cx2.fillStyle='rgba(255,255,255,.3)';
  rr(x+wide*.13,ty+wide*.035,w-wide*.26,Math.max(2,wide*.035),wide*.025);cx2.fill();

  // Trabajar en coordenadas locales: eje largo siempre horizontal.
  cx2.save();
  if(vertical){cx2.translate(x+w/2,ty+h/2);cx2.rotate(Math.PI/2);cx2.translate(-long/2,-wide/2);}
  else{cx2.translate(x,ty);}

  const L=long,T=wide, pad=L*.09;
  // Capó y baúl, con brillos para dar forma de automóvil
  const hoodGrad=cx2.createLinearGradient(0,0,0,T);
  hoodGrad.addColorStop(0,'rgba(255,255,255,.28)');
  hoodGrad.addColorStop(.5,'rgba(255,255,255,.06)');
  hoodGrad.addColorStop(1,'rgba(0,0,0,.16)');
  cx2.fillStyle=hoodGrad;rr(pad,T*.12,L*.23,T*.76,T*.12);cx2.fill();
  cx2.fillStyle='rgba(0,0,0,.09)';rr(L*.73,T*.13,L*.17,T*.74,T*.1);cx2.fill();

  // Parabrisas delantero y luneta trasera
  const glassGrad=cx2.createLinearGradient(0,T*.12,0,T*.88);
  glassGrad.addColorStop(0,'#17344f');glassGrad.addColorStop(.32,'#8fe0fa');
  glassGrad.addColorStop(.58,'#3d83aa');glassGrad.addColorStop(1,'#102b48');
  cx2.fillStyle='#122a43';rr(L*.29,T*.105,L*.39,T*.79,T*.17);cx2.fill();
  cx2.fillStyle=glassGrad;rr(L*.305,T*.14,L*.36,T*.72,T*.14);cx2.fill();
  // Pilar central y reflejos de cristal
  cx2.strokeStyle='rgba(255,255,255,.7)';cx2.lineWidth=Math.max(1,T*.025);
  cx2.beginPath();cx2.moveTo(L*.49,T*.17);cx2.lineTo(L*.49,T*.83);cx2.stroke();
  cx2.strokeStyle='rgba(255,255,255,.42)';
  cx2.beginPath();cx2.moveTo(L*.34,T*.2);cx2.lineTo(L*.43,T*.42);cx2.stroke();

  // Espejos laterales
  cx2.fillStyle=shade(col,-.28);
  rr(L*.34,-T*.045,L*.10,T*.12,T*.04);cx2.fill();
  rr(L*.34,T*.925,L*.10,T*.12,T*.04);cx2.fill();

  // Ruedas negras y llantas metálicas
  const wheel=(wx,wy)=>{
    cx2.fillStyle='#101923';rr(wx-T*.10,wy-T*.10,T*.20,T*.20,T*.07);cx2.fill();
    cx2.fillStyle='#667887';rr(wx-T*.055,wy-T*.055,T*.11,T*.11,T*.04);cx2.fill();
    cx2.fillStyle='#dce7ed';cx2.beginPath();cx2.arc(wx,wy,T*.025,0,Math.PI*2);cx2.fill();
  };
  [L*.23,L*.77].forEach(px=>{wheel(px,T*.035);wheel(px,T*.965)});

  // Faros delanteros, luces traseras y parrilla
  cx2.fillStyle='#fff7c5';cx2.shadowColor='#fff1a0';cx2.shadowBlur=5;
  [T*.27,T*.73].forEach(py=>{cx2.beginPath();cx2.ellipse(L*.965,py,L*.025,T*.075,0,0,Math.PI*2);cx2.fill()});
  cx2.shadowBlur=0;
  cx2.fillStyle='#a91f2b';
  [T*.27,T*.73].forEach(py=>{cx2.beginPath();cx2.ellipse(L*.035,py,L*.022,T*.065,0,0,Math.PI*2);cx2.fill()});
  cx2.fillStyle='rgba(35,45,55,.7)';rr(L*.94,T*.39,L*.035,T*.22,T*.025);cx2.fill();

  // Flecha blanca en el centro, orientada según la salida elegida
  cx2.restore();
  const mx=x+w/2,my=ty+h/2,a=CS*.145,v=VEC[b.dir];
  cx2.fillStyle='rgba(0,0,0,.24)';cx2.beginPath();cx2.arc(mx+1,my+2,a*.86,0,Math.PI*2);cx2.fill();
  cx2.fillStyle='rgba(255,255,255,.97)';cx2.beginPath();
  cx2.moveTo(mx+v[0]*a,my+v[1]*a*K);
  cx2.lineTo(mx-v[1]*a*.78-v[0]*a*.55,my+v[0]*a*.78*K-v[1]*a*.55*K);
  cx2.lineTo(mx+v[1]*a*.78-v[0]*a*.55,my-v[0]*a*.78*K-v[1]*a*.55*K);
  cx2.closePath();cx2.fill();
}
function draw(){
  const g=cx2,lg=g.createLinearGradient(0,0,0,H0);lg.addColorStop(0,'#a9d2e6');lg.addColorStop(1,'#8fb99a');
  g.fillStyle=lg;g.fillRect(0,0,W0,H0);
  g.save();g.shadowColor='rgba(22,40,58,.32)';g.shadowBlur=14;g.shadowOffsetY=8;g.fillStyle='#52677b';rr(OX-9,OY-9,COLS*CS+18,ROWS*CS*K+18,18);g.fill();g.restore();g.fillStyle='#657d94';rr(OX-7,OY-7,COLS*CS+14,ROWS*CS*K+14,16);g.fill();g.fillStyle='#52677b';rr(OX,OY,COLS*CS,ROWS*CS*K,12);g.fill();
  g.strokeStyle='rgba(255,255,255,.20)';g.lineWidth=1;g.beginPath();
  for(let i=0;i<=COLS;i++){g.moveTo(OX+i*CS,OY);g.lineTo(OX+i*CS,OY+ROWS*CS*K)}
  for(let j=0;j<=ROWS;j++){g.moveTo(OX,OY+j*CS*K);g.lineTo(OX+COLS*CS,OY+j*CS*K)}
  g.stroke();
  const l=[...new Set([...buses,...anims.map(a=>a.b)])].filter(b=>!b.mesh.done);
  l.sort((p,q)=>{const a=geo(p),b=geo(q);return a.y+a.h-(b.y+b.h)});
  l.forEach(drawBus);
}
function loop(now){
 requestAnimationFrame(loop);
 anims=anims.filter(a=>{
   const t=(now-a.t0)/a.dur,m=a.b.mesh;
   if(a.type==='go'){
     const e=Math.min(t,1),d=e*e*a.dist;m.ox=VEC[a.b.dir][0]*d;m.oy=VEC[a.b.dir][1]*d;
     if(t>=1){m.done=true;return false}
   }else{
     m.ox=Math.sin(t*Math.PI*4)*.055*(1-Math.min(t,1));m.oy=0;
     if(t>=1){m.ox=0;return false}
   }
   return true;
 });
 draw();
}
requestAnimationFrame(loop);
cnv.addEventListener('pointerdown',ev=>{
 const r=cnv.getBoundingClientRect(),px=ev.clientX-r.left,py=ev.clientY-r.top,H=CS*.3;
 const hit=[...buses].sort((p,q)=>geo(q).y-geo(p).y).find(b=>{const g=geo(b);return px>=g.x&&px<=g.x+g.w&&py>=g.y-H&&py<=g.y+g.h});
 if(hit)tap(hit);
});
/* ---------- Lógica ---------- */
function cellsOf(b){const a=[];for(let i=0;i<b.len;i++)a.push(b.h?[b.r,b.c+i]:[b.r+i,b.c]);return a}
function pathOf(b){
  const a=[];
  if(b.dir==='R')for(let c=b.c+b.len;c<COLS;c++)a.push([b.r,c]);
  if(b.dir==='L')for(let c=b.c-1;c>=0;c--)a.push([b.r,c]);
  if(b.dir==='D')for(let r=b.r+b.len;r<ROWS;r++)a.push([r,b.c]);
  if(b.dir==='U')for(let r=b.r-1;r>=0;r--)a.push([r,b.c]);
  return a;
}
function gen(n){
  for(let att=0;att<400;att++){
    const occ=new Set(),list=[];let ok=true;
    for(let i=0;i<n&&ok;i++){
      let placed=false;
      for(let t=0;t<80&&!placed;t++){
        const dir='UDLR'[rnd(4)],len=Math.random()<.3?3:2,h=dir==='L'||dir==='R';
        const b={dir,len,h,r:rnd(ROWS-(h?0:len-1)),c:rnd(COLS-(h?len-1:0))};
        if(cellsOf(b).some(([r,c])=>occ.has(r+','+c)))continue;
        if(pathOf(b).some(([r,c])=>occ.has(r+','+c)))continue;
        cellsOf(b).forEach(([r,c])=>occ.add(r+','+c));
        list.push(b);placed=true;
      }
      if(!placed)ok=false;
    }
    if(ok)return list;
  }
  return gen(n-1);
}
function start(){
  buses.forEach(b=>scene.remove(b.mesh));anims.forEach(a=>scene.remove(a.b.mesh));anims=[];
  over=false;busy=false;stops=[];
  const n=Math.min(5+level*2,12),nc=Math.min(3+Math.floor(level/2),7);
  buses=gen(n).map((b,i)=>({...b,id:i,color:COLORS[rnd(nc)]}));
  buses.forEach(b=>{b.mesh=makeVehicle(b);scene.add(b.mesh)});
  queue=[];
  buses.forEach(b=>{for(let i=0;i<SEATS;i++)queue.push({c:b.color,id:pid++})});
  for(let i=queue.length-1;i>0;i--){const j=rnd(i+1);[queue[i],queue[j]]=[queue[j],queue[i]]}
  drag=0;dragging=false;ghost=null;SLOTS=5;queue.forEach((q,i)=>q.cur=i/queue.length);
  $('msg').style.display='none';
  render();
}
let drag=0,dragging=false,lastA=0,ghost=null;
const rc=$('ring'),g2=rc.getContext('2d');
function dot(x,y,r,c){
  // tiny rounded passenger: shadow, glossy body and bright crown
  g2.save();g2.shadowColor='rgba(20,34,52,.35)';g2.shadowBlur=5;g2.shadowOffsetY=4;
  const grad=g2.createRadialGradient(x-r*.38,y-r*.48,r*.08,x,y,r*1.15);grad.addColorStop(0,shade(c,.58));grad.addColorStop(.48,c);grad.addColorStop(1,shade(c,-.38));
  g2.fillStyle=grad;g2.beginPath();g2.arc(x,y,r,0,Math.PI*2);g2.fill();g2.restore();
  g2.fillStyle='rgba(255,255,255,.72)';g2.beginPath();g2.ellipse(x-r*.3,y-r*.36,r*.27,r*.18,-.6,0,Math.PI*2);g2.fill();
  g2.fillStyle='rgba(255,255,255,.18)';g2.beginPath();g2.arc(x+r*.2,y+r*.28,r*.24,0,7);g2.fill();
}
function drawRing(now){
  const dpr=Math.min(devicePixelRatio||1,2),W=rc.clientWidth,H=rc.clientHeight;if(!W)return;
  if(rc.width!==Math.round(W*dpr)||rc.height!==Math.round(H*dpr)){rc.width=Math.round(W*dpr);rc.height=Math.round(H*dpr)}
  const g=g2;g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);
  const cx=W/2,cy=H/2-9,a=W*.385,b=H*.315,n=queue.length;
  // floor shadow and raised pale platform
  const floor=g.createRadialGradient(cx,cy,10,cx,cy,Math.max(W,H)*.55);floor.addColorStop(0,'#f1f7fc');floor.addColorStop(1,'#b6c7d9');g.fillStyle=floor;g.fillRect(0,0,W,H);
  // outer bevel / track body
  g.save();g.shadowColor='rgba(26,42,62,.35)';g.shadowBlur=12;g.shadowOffsetY=7;g.strokeStyle='#71859b';g.lineWidth=54;g.beginPath();g.ellipse(cx,cy,a,b,0,0,Math.PI*2);g.stroke();g.restore();
  const rail=g.createLinearGradient(0,cy-b-30,0,cy+b+30);rail.addColorStop(0,'#ffffff');rail.addColorStop(.48,'#d8e5f0');rail.addColorStop(1,'#8194a9');
  g.strokeStyle=rail;g.lineWidth=49;g.beginPath();g.ellipse(cx,cy-2,a,b,0,0,Math.PI*2);g.stroke();
  // dark conveyor bed
  const bed=g.createLinearGradient(0,cy-b,0,cy+b);bed.addColorStop(0,'#8296ad');bed.addColorStop(.5,'#e5edf5');bed.addColorStop(1,'#71869e');
  g.strokeStyle=bed;g.lineWidth=39;g.beginPath();g.ellipse(cx,cy,a,b,0,0,Math.PI*2);g.stroke();
  g.strokeStyle='rgba(255,255,255,.85)';g.lineWidth=2.5;g.beginPath();g.ellipse(cx,cy,a,b,0,0,Math.PI*2);g.stroke();
  // center opening with inset shadow
  g.fillStyle='#b7c8d9';g.beginPath();g.ellipse(cx,cy,a-29,b-27,0,0,Math.PI*2);g.fill();
  g.fillStyle='rgba(255,255,255,.45)';g.beginPath();g.ellipse(cx,cy-3,a-37,b-35,0,0,Math.PI*2);g.fill();
  const items=queue.map((q,i)=>{const f=(((i+drag)/n)%1+1)%1;let d=f-q.cur;d-=Math.round(d);q.cur=((q.cur+d*(dragging?1:.22))%1+1)%1;const t=Math.PI/2+q.cur*Math.PI*2,o=(q.id%3-1)*7,c=Math.cos(t),ss=Math.sin(t);return{q,x:cx+(a+o)*c,y:cy+(b+o*.55)*ss,r:7.2+2.6*(ss+1)/2,k:Math.min(q.cur,1-q.cur),depth:ss}});
  let front=null;items.forEach(it=>{if(!front||it.k<front.k)front=it});
  items.sort((p,q)=>p.y-q.y).forEach(it=>{dot(it.x,it.y,it.r,it.q.c);if(it===front){g.strokeStyle='#fff';g.lineWidth=2.5;g.beginPath();g.arc(it.x,it.y,it.r+3,0,Math.PI*2);g.stroke()}});
  if(ghost){const t=(now-ghost.t)/380;if(t>=1)ghost=null;else{g.globalAlpha=1-t;dot(cx,cy+b+5+t*30,8*(1-t*.5),ghost.c);g.globalAlpha=1}}
  // selection pointer and count in the center
  g.fillStyle='#1478dc';g.beginPath();g.moveTo(cx-10,cy+b+30);g.lineTo(cx+10,cy+b+30);g.lineTo(cx,cy+b+43);g.closePath();g.fill();
  g.fillStyle='#344b63';g.textAlign='center';g.font='800 28px system-ui,sans-serif';g.fillText(n,cx,cy+8);g.font='700 10px system-ui,sans-serif';g.fillStyle='#61758a';g.fillText('PASAJEROS',cx,cy+24);
}
const ang=ev=>{const r=rc.getBoundingClientRect();return Math.atan2((ev.clientY-r.top-(r.height/2-10))/(r.height*.33),(ev.clientX-r.left-r.width/2)/(r.width*.4))};
rc.addEventListener('pointerdown',ev=>{if(busy||over||!queue.length)return;dragging=true;lastA=ang(ev);rc.setPointerCapture(ev.pointerId)});
rc.addEventListener('pointermove',ev=>{if(!dragging)return;const a=ang(ev);let d=a-lastA;d-=Math.round(d/(2*Math.PI))*2*Math.PI;lastA=a;drag+=d/(2*Math.PI)*queue.length});
const spinEnd=()=>{if(dragging){dragging=false;snap()}};
rc.addEventListener('pointerup',spinEnd);rc.addEventListener('pointercancel',spinEnd);
async function snap(){
  const n=queue.length;if(!n)return;
  const k=Math.round(drag),j=((-k)%n+n)%n;drag=0;
  if(j)queue=queue.slice(j).concat(queue.slice(0,j));
  busy=true;await boardAll();busy=false;check();
}
requestAnimationFrame(function f(n){drawRing(n);requestAnimationFrame(f)});
function render(){
  $('lv').textContent='Nivel '+level;
  const st=$('stops');st.innerHTML='';
  for(let i=0;i<SLOTS;i++){
    const s=stops[i],d=document.createElement('div');d.className='slot';
    if(s){let seats='';for(let k=0;k<SEATS;k++)seats+=`<div class="seat${k<s.seats?' on':''}"></div>`;
      d.innerHTML=`<div class="sbus" style="background:${s.color}">${seats}</div>`}
    st.appendChild(d);
  }
  for(let i=SLOTS;i<7;i++){const d=document.createElement('div');d.className='slot lock';d.textContent='+';d.onclick=()=>{if(!busy&&!over&&SLOTS<7){SLOTS++;render()}};st.appendChild(d)}

}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function tap(b){
  if(busy||over)return;
  const blocked=pathOf(b).some(([r,c])=>buses.some(o=>o!==b&&cellsOf(o).some(([r2,c2])=>r2===r&&c2===c)));
  if(blocked||stops.length>=SLOTS){anims.push({b,type:'shake',t0:performance.now(),dur:350});return}
  busy=true;
  anims.push({b,type:'go',t0:performance.now(),dur:600,dist:pathOf(b).length+b.len+1});
  buses=buses.filter(o=>o!==b);
  await wait(600);
  stops.push({color:b.color,seats:0});
  render();
  await boardAll();
  busy=false;
  check();
}
async function boardAll(){
  while(queue.length){
    const s=stops.find(x=>x.color===queue[0].c&&x.seats<SEATS);
    if(!s)break;
    ghost={c:queue.shift().c,t:performance.now()};s.seats++;render();await wait(160);
    if(s.seats===SEATS){await wait(220);stops.splice(stops.indexOf(s),1);render()}
  }
}
function check(){
  if(!buses.length&&!queue.length)return end('¡Nivel completado! 🎉','Todos los pasajeros llegaron a su destino.','Siguiente nivel',()=>{level++;start()});
  if(queue.length&&stops.length>=SLOTS&&!queue.some(q=>stops.some(x=>x.color===q.c)))end('¡Atasco total! 🚦','Las paradas están llenas y nadie puede subir.','Reintentar',start);
}
function end(t,p,b,fn){over=true;$('mt').textContent=t;$('mp').textContent=p;$('mb').textContent=b;$('mb').onclick=fn;$('msg').style.display='flex'}
$('rs').onclick=start;
start();
</script>

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
}
